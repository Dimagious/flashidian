<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-labelledby="flashy-banner-title-dark">
  <title id="flashy-banner-title-dark">Flashy (flashidian): your notes are already flashcards. A row of a table in a note becomes a card, swiped right as got it.</title>
  <rect x="0.5" y="0.5" width="899" height="159" rx="20" fill="#1e1e1e" stroke="#363636"/>
  <!-- mark: a stack of cards, the top one tilted -->
  <g transform="translate(32,32) scale(3)">
    <rect x="2" y="2" width="28" height="28" rx="7" fill="#a48cff"/>
    <rect x="8" y="10" width="14" height="15" rx="2.5" fill="#ffffff" fill-opacity=".45"/>
    <rect x="11" y="7" width="14" height="15" rx="2.5" fill="#ffffff" transform="rotate(8 18 14.5)"/>
  </g>
  <g transform="translate(152,78.5)">
    <text x="0" y="0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <tspan font-weight="700" font-size="36" fill="#e4e4e8">Flashy</tspan><tspan dx="12" font-size="15" fill="#8e8e8e" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace">flashidian</tspan>
    </text>
    <text x="0" y="32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#b3b3b8">Your notes are already flashcards.</text>
  </g>
  <!-- before: a row of a table in a note -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
    <rect x="512" y="58" width="132" height="44" rx="7" fill="#26262a" stroke="#3a3a40"/>
    <path d="M578 58v44" stroke="#3a3a40"/>
    <text x="526" y="85" fill="#e4e4e8">Japan</text>
    <text x="590" y="85" fill="#e4e4e8">Tokyo</text>
  </g>
  <!-- arrow -->
  <path d="M658 80h36M686 72l8 8-8 8" fill="none" stroke="#a48cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- after: the card, mid swipe to the right -->
  <g transform="rotate(7 790 80)">
    <rect x="726" y="30" width="128" height="100" rx="12" fill="#2a2a2e" stroke="#4cc38a" stroke-width="2"/>
    <rect x="740" y="42" width="52" height="20" rx="4" fill="none" stroke="#4cc38a" stroke-width="1.6"/>
    <text x="766" y="56.5" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing=".6" fill="#4cc38a">GOT IT</text>
    <text x="790" y="94" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e4e4e8">Japan</text>
  </g>
</svg>
