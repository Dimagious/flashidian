name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, typecheck, unit tests with the coverage gate, the scanner, the release check, the build with its
  # Node-only check, and the bundle artifact.
  kit:
    uses: Dimagious/obsidian-plugin-dev-kit/.github/workflows/plugin-ci.yml@abbd501407745e636ee50a2c8725b0d861d6f8bc # v0.6.0
