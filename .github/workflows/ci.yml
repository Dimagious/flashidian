name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, typecheck, unit tests with the coverage gate, the scanner, the release check, the build with its
  # Node-only check, and the bundle artifact.
  kit:
    uses: Dimagious/obsidian-plugin-dev-kit/.github/workflows/plugin-ci.yml@7c8c4acd95411becb54921eb0aeba14d0226ebe9 # v0.4.1
