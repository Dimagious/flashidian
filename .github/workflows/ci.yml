name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, typecheck, unit tests with the coverage gate, the scanner, the release check, the build with its
  # Node-only check, and the bundle artifact.
  kit:
    uses: Dimagious/obsidian-plugin-dev-kit/.github/workflows/plugin-ci.yml@0f3f849ab818cdfd7b3316bd56d09584df8b22cf # v0.5.0
